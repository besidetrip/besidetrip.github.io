<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비사이드 트립</title>
<meta name="description" content="비사이드 트립 — 플랜 B까지 챙기는 여행 일정 앱">
<style>
  :root { --bg:#fff; --ink:#121212; --ink2:#5E5E5E; --line:#E4E4E4; --accent:#5B4BF5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --ink:#F2F2F2; --ink2:#A8A8A8; --line:#2A2A2A; --accent:#8A7DFF; } }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif; line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--ink2); margin:0 0 24px; }
  nav a { display:block; padding:14px 0; border-top:1px solid var(--line); color:var(--accent); text-decoration:none; font-weight:600; }
  nav a:last-child { border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>비사이드 트립</h1>
  <p>비 오면 플랜 B로. 대안까지 챙기는 여행 일정 앱이에요.</p>
  <nav>
    <a href="/privacy/">개인정보처리방침</a>
    <a href="/terms/">이용약관</a>
    <a href="mailto:besidetrip@gmail.com">문의하기</a>
  </nav>
</main>
</body>
</html>
